[build]
  # Use standard webpack build on Netlify (--turbopack can fail in CI)
  command = "npm run build:netlify"
  # Next.js static export uses distDir: 'publish', so the built site lives in publish/ not .next
  publish = "publish"

[build.environment]
  NODE_VERSION = "18"

# Redirect /benchmarks to the static report so the report always loads
[[redirects]]
  from = "/benchmarks"
  to = "/benchmarks.html"
  status = 302

# Serve the static benchmark report (must come before SPA catch-all)
[[redirects]]
  from = "/benchmarks.html"
  to = "/benchmarks.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

# Allow same-origin framing for benchmark report so /benchmarks page can embed it in an iframe
[[headers]]
  for = "/benchmarks.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
